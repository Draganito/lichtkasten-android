# Release APK on a v* tag, attached to a GitHub release. Signed with the
# release key when the four KEYSTORE_* secrets exist, with the debug key
# otherwise (Android treats the two as different apps).
name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "27.3.13750724"
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

jobs:
  release:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: lichtkasten-android
      - name: Core commit
        id: core
        run: echo "sha=$(tr -d '[:space:]' < lichtkasten-android/lichtkasten-core.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Draganito/lichtkasten
          ref: ${{ steps.core.outputs.sha }}
          path: lichtkasten

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: lichtkasten-android/rust/lichtkasten-mobile
      - name: cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.1 ndk;${{ env.NDK_VERSION }}"
      - uses: gradle/actions/setup-gradle@v4

      # `secrets` is not available in a step `if`; the value goes through env.
      - name: Release key
        if: env.KEYSTORE_BASE64 != ''
        working-directory: lichtkasten-android/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        working-directory: lichtkasten-android/android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          ./gradlew --no-daemon assembleRelease
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' ../rust/lichtkasten-mobile/Cargo.toml | head -1)"
          cp app/build/outputs/apk/release/app-release.apk "lichtkasten-${version}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: lichtkasten-release
          path: lichtkasten-android/android/lichtkasten-*.apk
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: lichtkasten-android/android/lichtkasten-*.apk
          generate_release_notes: true
